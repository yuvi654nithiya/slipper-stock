<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slipper Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EDE8DF;
    --ink: #23201C;
    --ink-soft: #5B564E;
    --card: #FFFFFF;
    --card-border: #DCD5C8;
    --accent: #5B3A52;
    --accent-soft: #EFE3EC;
    --tag: #C99A3D;
    --tag-soft: #FBF1DC;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Public Sans', sans-serif;
    line-height: 1.5;
  }
  header{
    padding: 48px 24px 28px;
    max-width: 1080px;
    margin: 0 auto;
  }
  header h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2rem, 4vw, 2.9rem);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  header p{
    margin: 0;
    color: var(--ink-soft);
    font-size: 1.02rem;
    max-width: 46ch;
  }
  .stat{
    display:inline-block;
    margin-top: 14px;
    font-size: 0.92rem;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .filters{
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: 14px 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    max-width: 1080px;
    margin: 0 auto;
    border-bottom: 1px solid var(--card-border);
  }
  .filters input, .filters select{
    font-family: 'Public Sans', sans-serif;
    font-size: 0.95rem;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--ink);
  }
  .filters input{ flex: 1 1 200px; min-width: 160px; }
  .filters select{ flex: 0 1 150px; }
  .filters button{
    font-family: 'Public Sans', sans-serif;
    font-size: 0.9rem;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .filters button:hover{ background: var(--card); }

  main{
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }
  #catalog{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 22px;
  }
  .card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card .photo{
    aspect-ratio: 1 / 1;
    background: #F4F0E8;
    overflow: hidden;
  }
  .card .photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card .body{
    padding: 14px 16px 16px;
  }
  .card .artno{
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0 0 4px;
  }
  .card .colors{
    font-family: 'Fraunces', serif;
    font-size: 1.08rem;
    margin: 0 0 10px;
  }
  .chips{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip{
    font-size: 0.78rem;
    background: var(--tag-soft);
    color: #7A5A16;
    padding: 3px 9px;
    border-radius: 999px;
  }
  #empty{
    display:none;
    text-align:center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-size: 0.98rem;
  }
  footer{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 50px;
    color: var(--ink-soft);
    font-size: 0.82rem;
  }
</style>
</head>
<body>

<header>
  <h1>Slipper Stock</h1>
  <p>Current styles, sizes and colours available — updated straight from the stock sheet.</p>
  <span class="stat" id="stat">Loading stock…</span>
</header>

<div class="filters">
  <input type="text" id="searchArt" placeholder="Search by art no.">
  <select id="filterSize"><option value="">All sizes</option></select>
  <select id="filterColor"><option value="">All colours</option></select>
  <button id="clearBtn">Clear</button>
</div>

<main>
  <div id="catalog"></div>
  <div id="empty">No slippers match that search. Try clearing the filters.</div>
</main>

<footer>Data is pulled from a Google Sheet and refreshes automatically — no need to touch this page to update stock.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  // ====== EDIT THIS ONE LINE ======
  // Paste your published Google Sheet CSV link here (see setup instructions).
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSAnBvGB53rj0Gv4b98sVgjrDyRZ29K6SQ4H3CLtDDDErwoGoutB73wSDuKBWpJ6XAz-zlMxXxSiZcd/pub?gid=0&single=true&output=csv";
  // =================================

  // Demo data shown until you connect your real sheet, so the page never looks broken.
  const DEMO_DATA = [
    { "Art No": "SL-101", "Colors": "Tan, Brown", "Sizes Available": "6, 7, 8, 9", "Photo": "" },
    { "Art No": "SL-102", "Colors": "Black", "Sizes Available": "7, 8, 9, 10", "Photo": "" },
    { "Art No": "SL-103", "Colors": "Grey, Navy", "Sizes Available": "6, 7, 8", "Photo": "" },
    { "Art No": "SL-104", "Colors": "Beige", "Sizes Available": "8, 9, 10", "Photo": "" },
  ];

  const PLACEHOLDER_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
       <rect width="300" height="300" fill="#F4F0E8"/>
       <text x="50%" y="50%" font-family="sans-serif" font-size="14" fill="#B8AF9D" text-anchor="middle">No photo yet</text>
     </svg>`
  );

  let allItems = [];

  function resolveImage(value){
    if (!value) return PLACEHOLDER_IMG;
    if (/^https?:\/\//i.test(value)) return value;
    return "images/" + value; // filename stored in an /images folder next to this file
  }

  function splitList(value){
    return (value || "").split(",").map(s => s.trim()).filter(Boolean);
  }

  function render(items){
    const grid = document.getElementById('catalog');
    const empty = document.getElementById('empty');
    grid.innerHTML = "";

    if (items.length === 0){
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    for (const item of items){
      const art = item["Art No"] || "";
      const colors = splitList(item["Colors"]);
      const sizes = splitList(item["Sizes Available"]);
      const img = resolveImage(item["Photo"]);

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="photo"><img src="${img}" alt="Slipper ${art}" onerror="this.src='${PLACEHOLDER_IMG}'"></div>
        <div class="body">
          <p class="artno">Art no. ${art}</p>
          <p class="colors">${colors.join(' / ') || 'Colour not set'}</p>
          <div class="chips">${sizes.map(s => `<span class="chip">Size ${s}</span>`).join('')}</div>
        </div>`;
      grid.appendChild(card);
    }
  }

  function populateFilters(items){
    const sizeSet = new Set(), colorSet = new Set();
    items.forEach(item => {
      splitList(item["Sizes Available"]).forEach(s => sizeSet.add(s));
      splitList(item["Colors"]).forEach(c => colorSet.add(c));
    });
    const sizeSel = document.getElementById('filterSize');
    const colorSel = document.getElementById('filterColor');
    [...sizeSet].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(s => {
      sizeSel.innerHTML += `<option value="${s}">Size ${s}</option>`;
    });
    [...colorSet].sort().forEach(c => {
      colorSel.innerHTML += `<option value="${c}">${c}</option>`;
    });
  }

  function applyFilters(){
    const q = document.getElementById('searchArt').value.trim().toLowerCase();
    const size = document.getElementById('filterSize').value;
    const color = document.getElementById('filterColor').value;

    const filtered = allItems.filter(item => {
      const artMatch = !q || (item["Art No"] || "").toLowerCase().includes(q);
      const sizeMatch = !size || splitList(item["Sizes Available"]).includes(size);
      const colorMatch = !color || splitList(item["Colors"]).includes(color);
      return artMatch && sizeMatch && colorMatch;
    });
    render(filtered);
  }

  document.getElementById('searchArt').addEventListener('input', applyFilters);
  document.getElementById('filterSize').addEventListener('change', applyFilters);
  document.getElementById('filterColor').addEventListener('change', applyFilters);
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('searchArt').value = "";
    document.getElementById('filterSize').value = "";
    document.getElementById('filterColor').value = "";
    applyFilters();
  });

  function boot(items){
    allItems = items;
    document.getElementById('stat').textContent = `${items.length} style${items.length === 1 ? '' : 's'} in stock`;
    populateFilters(items);
    render(items);
  }

  if (SHEET_CSV_URL.startsWith("PASTE_")){
    boot(DEMO_DATA); // showing demo data until the sheet link is connected
  } else {
    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (results) => boot(results.data.filter(r => r["Art No"])),
      error: () => boot(DEMO_DATA)
    });
  }
</script>

</body>
</html>
